name: Test

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUN_VERSION: "1.3.1"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishfacts_ai_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Push schema to test database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fishfacts_ai_backend_test
        run: bunx drizzle-kit push --force
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format Check
        run: bun run format:check
      - name: Test
        run: bun test
